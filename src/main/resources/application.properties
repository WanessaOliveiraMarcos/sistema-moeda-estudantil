spring.application.name=app

# MySQL (sobe com: docker compose up -d). Os valores padrão batem com o docker-compose.yml;
# para outro banco, defina DB_HOST, DB_PORT, DB_NAME, DB_USERNAME e DB_PASSWORD no ambiente.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:moedaestudantil}
spring.datasource.username=${DB_USERNAME:moeda}
spring.datasource.password=${DB_PASSWORD:moeda123}

# As tabelas são criadas pelo Flyway (src/main/resources/db/migration);
# o Hibernate só confere se as entidades batem com elas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# E-mails (notificação de moedas e cupons). Por padrão vão para o Mailpit do docker-compose.yml
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
app.mail.remetente=Moeda Estudantil <nao-responda@moedaestudantil.local>

# Storage de arquivos enviados (fotos das vantagens), relativo à pasta onde a aplicação roda
app.storage.dir=storage
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# permite responder com a mensagem de erro quando o upload passa do limite
server.tomcat.max-swallow-size=20MB
