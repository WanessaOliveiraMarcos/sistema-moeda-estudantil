<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Moeda Estudantil'">Moeda Estudantil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/js/confirmar.js}"></script>
</head>
<body>

<header th:fragment="menu(ativo)" class="menu">
    <a th:href="@{/}" class="marca">Moeda Estudantil</a>
    <nav th:if="${perfil}">
        <th:block th:if="${perfil == 'ADMIN'}">
            <a th:href="@{/instituicoes}" th:classappend="${ativo == 'instituicoes'} ? 'ativo'">Instituições</a>
            <a th:href="@{/professores}" th:classappend="${ativo == 'professores'} ? 'ativo'">Professores</a>
            <a th:href="@{/alunos}" th:classappend="${ativo == 'alunos'} ? 'ativo'">Alunos</a>
            <a th:href="@{/empresas}" th:classappend="${ativo == 'empresas'} ? 'ativo'">Empresas parceiras</a>
        </th:block>
        <th:block th:if="${perfil == 'ALUNO'}">
            <a th:href="@{/vantagens}" th:classappend="${ativo == 'vantagens'} ? 'ativo'">Vantagens</a>
            <a th:href="@{/minhas-turmas}" th:classappend="${ativo == 'turmas'} ? 'ativo'">Turmas</a>
            <a th:href="@{/transferencias}" th:classappend="${ativo == 'transferencias'} ? 'ativo'">Enviar a colega</a>
            <a th:href="@{/extrato}" th:classappend="${ativo == 'extrato'} ? 'ativo'">Extrato</a>
        </th:block>
        <th:block th:if="${perfil == 'PROFESSOR'}">
            <a th:href="@{/turmas}" th:classappend="${ativo == 'turmas'} ? 'ativo'">Turmas</a>
            <a th:href="@{/alunos}" th:classappend="${ativo == 'alunos'} ? 'ativo'">Alunos</a>
            <a th:href="@{/autorizacoes}" th:classappend="${ativo == 'autorizacoes'} ? 'ativo'">Autorizações<span
                    class="contador" th:if="${autorizacoesPendentes != null and autorizacoesPendentes > 0}"
                    th:text="${autorizacoesPendentes}"></span></a>
            <a th:href="@{/extrato}" th:classappend="${ativo == 'extrato'} ? 'ativo'">Extrato</a>
        </th:block>
        <th:block th:if="${perfil == 'EMPRESA'}">
            <a th:href="@{/minhas-vantagens}" th:classappend="${ativo == 'minhas-vantagens'} ? 'ativo'">Minhas vantagens</a>
            <a th:href="@{/minhas-vantagens/resgates}" th:classappend="${ativo == 'resgates'} ? 'ativo'">Compras</a>
        </th:block>
    </nav>
    <div class="usuario" th:if="${perfil}">
        <a class="saldo" th:if="${saldoAtual != null}" th:href="@{/extrato}" title="Ver extrato">
            <svg th:replace="~{fragments/layout :: moeda}"></svg>
            <strong th:text="${#numbers.formatInteger(saldoAtual, 1, 'POINT')}">0</strong>
            <small>moedas</small>
        </a>
        <span>
            <strong th:text="${usuarioLogado.nome}"></strong>
            <small th:text="${usuarioLogado.perfil.descricao}"></small>
        </span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="botao secundario">Sair</button>
        </form>
    </div>
    <a th:href="@{/login}" class="entrar" th:unless="${perfil}">Entrar</a>
</header>

<!-- ícone de moeda, usado ao lado dos saldos -->
<svg th:fragment="moeda" class="moeda" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="11" fill="#c9a24d" stroke="#8e7a53" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="7.5" fill="none" stroke="#f3e2b0" stroke-width="1.2"/>
    <path d="M12 7.5v9M14.6 9.6c-.4-.8-1.4-1.3-2.6-1.3-1.5 0-2.5.7-2.5 1.8 0 2.4 5.2 1.3 5.2 3.8 0 1.1-1.1 1.9-2.7 1.9-1.3 0-2.3-.5-2.8-1.4"
          fill="none" stroke="#5a4520" stroke-width="1.4" stroke-linecap="round"/>
</svg>

<!-- card de vantagem do catálogo -->
<article th:fragment="vantagem(v)" class="vantagem">
    <img th:src="@{'/storage/' + ${v.foto}}" th:alt="${v.nome}" loading="lazy">
    <div class="corpo">
        <span class="empresa" th:text="${v.empresa.nome}"></span>
        <h2 th:text="${v.nome}"></h2>
        <p class="custo" th:text="${v.valor} + ' moedas'"></p>
        <p th:text="${v.descricao}"></p>
        <form th:if="${perfil == 'ALUNO'}" class="resgatar" method="post"
              th:action="@{/vantagens/{id}/resgatar(id=${v.id})}"
              th:data-confirmar="|Trocar ${v.valor} moedas por “${v.nome}”?|">
            <button type="submit" class="botao" th:disabled="${saldoAtual != null and saldoAtual < v.valor}"
                    th:text="${saldoAtual != null and saldoAtual < v.valor} ? 'Saldo insuficiente' : 'Resgatar'">Resgatar</button>
        </form>
    </div>
</article>

<div th:fragment="mensagens">
    <p class="alerta sucesso" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="alerta falha" th:if="${erro}" th:text="${erro}"></p>
</div>

</body>
</html>
