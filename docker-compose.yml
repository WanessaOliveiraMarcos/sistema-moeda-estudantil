# Banco de desenvolvimento: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: moeda-estudantil-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-moedaestudantil}
      MYSQL_USER: ${DB_USERNAME:-moeda}
      MYSQL_PASSWORD: ${DB_PASSWORD:-moeda123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      TZ: America/Sao_Paulo
    ports:
      # 3307 no host para não conflitar com um MySQL/MariaDB instalado na máquina
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Servidor de e-mail de teste: captura os e-mails enviados pelo sistema.
  # Caixa de entrada em http://localhost:8025 (nada é enviado de verdade)
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: moeda-estudantil-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
